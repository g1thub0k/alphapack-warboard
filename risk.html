<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Pack · At risk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;560;700&family=JetBrains+Mono:wght@450;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="risk">
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Alpha Pack ClanData</h1>
        <div class="sub" id="updated">War board</div>
      </div>
      <nav class="nav">
        <a href="index.html" class="">War status</a>
        <a href="efficiency.html" class="">Attack efficiency</a>
        <a href="risk.html" class="active">At risk</a>
        <a href="rules.html">Rules</a>
      </nav>
    </header>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search name or tag" />
      
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
<tr>
  <th data-sort="name">Member</th>
  <th data-sort="action">Suggested action</th>
  <th data-sort="missed">Missed</th>
  <th>Reason</th>
  <th data-sort="efficiency">Eff</th>
</tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>No members match.</div>
    </div>
    <p class="foot">Same metrics as the Sheet / Softr — display only. No new features.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
