<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Pack · Attack efficiency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;560;700&family=JetBrains+Mono:wght@450;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="efficiency">
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Alpha Pack ClanData</h1>
        <div class="sub" id="updated">War board</div>
      </div>
      <nav class="nav">
        <a href="index.html">War status</a>
        <a href="efficiency.html" class="active">Attack efficiency</a>
        <a href="rules.html">Rules</a>
      </nav>
    </header>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search name or tag" />
      <div class="avg-chip" id="avg-eff" aria-label="Average efficiency">
        <span class="avg-label">Avg eff</span>
        <span class="avg-value mono">—</span>
      </div>
    </div>
    <div class="eff-tip-banner" id="eff-tip-banner" hidden role="status"></div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="name" class="col-member">Member</th>
              <th data-sort="efficiency" class="col-eff">Efficiency <span class="th-tip has-tip" tabindex="0" role="button" aria-expanded="false" aria-label="About Efficiency" data-tip="Fame ÷ attacks made. Raw, no adjustment." title="Fame ÷ attacks made. Raw, no adjustment.">ⓘ</span></th>
              <th data-sort="thisWeekAttacks" class="col-week">This week</th>
              <th data-sort="contribution" class="col-contrib">Contribution <span class="th-tip has-tip" tabindex="0" role="button" aria-expanded="false" aria-label="About Contribution" data-tip="Same as Eff, pulled toward the clan average until 16 attacks." title="Same as Eff, pulled toward the clan average until 16 attacks.">ⓘ</span></th>
              <th data-sort="rank" class="col-rank">Rank <span class="th-tip has-tip" tabindex="0" role="button" aria-expanded="false" aria-label="About Rank" data-tip="Sorted by Contribution, not Eff." title="Sorted by Contribution, not Eff.">ⓘ</span></th>
              <th class="col-last">Last week</th>
              <th data-sort="fame" class="col-fame">All-time</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>No members match.</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
